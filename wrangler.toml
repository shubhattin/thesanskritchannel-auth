name = "tsc-users"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-08-06"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
